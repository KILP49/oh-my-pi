# Cross-builds the Termux / android-arm64 native addon and attaches it to a
# per-version release, so the phone can update without a local Rust toolchain:
#
#   curl -fsSL https://raw.githubusercontent.com/KILP49/oh-my-pi/android-18.6.3/scripts/termux/update-omp.sh | bash -s -- <version>
#
name: termux-android-addon

on:
  push:
    branches: ["android-*"]
    paths:
      - "crates/**"
      - "packages/natives/**"
      - ".github/workflows/termux-android-addon.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  addon:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # rust-toolchain.toml pins nightly-2026-08-12 (without the android target);
      # install that exact toolchain plus aarch64-linux-android, else cargo runs
      # without std for the target.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-12
          targets: aarch64-linux-android

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-android-${{ hashFiles('Cargo.lock') }}

      - name: Resolve version
        id: v
        run: echo "version=$(node -p "require('./packages/natives/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cross-build pi_natives (aarch64-linux-android)
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          # cmake-based C dep (opusic-sys) picks these up via cmake-rs;
          # ANDROID_ABI + toolchain file make it a proper NDK cross build.
          CMAKE_TOOLCHAIN_FILE: ${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake
          ANDROID_ABI: arm64-v8a
          ANDROID_PLATFORM: android-24
        run: |
          set -uo pipefail
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          API=24
          export PATH="$TOOLCHAIN/bin:$PATH"
          export CC_aarch64_linux_android="$TOOLCHAIN/bin/aarch64-linux-android${API}-clang"
          export CXX_aarch64_linux_android="$TOOLCHAIN/bin/aarch64-linux-android${API}-clang++"
          export AR_aarch64_linux_android="$TOOLCHAIN/bin/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CC_aarch64_linux_android"
          export CMAKE_POLICY_VERSION_MINIMUM=3.5
          export PCRE2_SYS_STATIC=1
          export RUSTC_BOOTSTRAP=1
          export RUSTFLAGS="-C target-cpu=generic"
          echo "== toolchain =="
          rustc -vV | sed -n '1,3p'; cargo -V; cmake --version | head -1; ninja --version || true; node -v
          echo "== ndk =="; ls "$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" && head -20 "$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" | grep -i -m3 abi || true
          mkdir -p android-build
          set +e
          ( cd crates/pi-natives && npx --yes --package @napi-rs/cli@3.7.2 napi build \
              --manifest-path Cargo.toml \
              --package-json-path ../../packages/natives/package.json \
              --target aarch64-linux-android \
              --platform --no-js --dts index.d.ts \
              -o ../../android-build --profile local ) 2>&1 | tee /tmp/build.log
          rc=${PIPESTATUS[0]}
          set -e
          tail -c 60000 /tmp/build.log > ci-debug.log
          if [ "$rc" -ne 0 ]; then echo "::error::napi build failed rc=$rc (see ci-debug.log)"; exit "$rc"; fi
          ls -la android-build

      - name: Strip + stamp + verify
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          exec > >(tee -a /tmp/build.log) 2>&1
          set -euo pipefail
          ADDON=android-build/pi_natives.android-arm64.node
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" --strip-unneeded "$ADDON"
          bun scripts/stamp-native-version.ts "$ADDON"
          strings "$ADDON" | grep -m1 "PI_NATIVES_VERSION_STAMP:" || { echo "::error::version stamp missing"; exit 1; }
          ls -la "$ADDON"

      - uses: actions/upload-artifact@v4
        with:
          name: pi_natives.android-arm64
          path: android-build/pi_natives.android-arm64.node

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-addon-${{ steps.v.outputs.version }}
          name: "android-arm64 addon ${{ steps.v.outputs.version }}"
          body: |
            Cross-built `pi_natives.android-arm64.node` (NDK r27c) for `@oh-my-pi/pi-natives@${{ steps.v.outputs.version }}`.

            Update on device:

            ```
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/scripts/termux/update-omp.sh | bash -s -- ${{ steps.v.outputs.version }}
            ```
          files: android-build/pi_natives.android-arm64.node
          overwrite_files: true
          prerelease: true

      # On failure, commit the tail of the build log to the branch so it can be
      # read without API access (root-level file: never re-triggers this workflow).
      - name: Publish failure log
        if: failure()
        run: |
          set -euo pipefail
          [ -f /tmp/build.log ] || { echo "no build log"; exit 0; }
          tail -c 60000 /tmp/build.log > ci-debug.log
          git config user.name "termux-ci-bot"
          git config user.email "termux-ci-bot@users.noreply.github.com"
          git add -f ci-debug.log
          git commit -m "ci: capture failure log [skip ci]"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
